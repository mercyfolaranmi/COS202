<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .form-body { padding: 40px; }
        .section { margin-bottom: 30px; }
        .section-title {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
        }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .course-entry {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .course-title { font-size: 1.2em; color: #667eea; font-weight: 600; }
        .course-number {
            background: #667eea;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-add-course {
            background: #28a745;
            color: white;
            margin-bottom: 20px;
            width: auto;
        }
        .grade-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .grade-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CGPA Calculator</h1>
            <p>Calculate your Cumulative Grade Point Average</p>
        </div>
        <div class="form-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="section">
                    <h2 class="section-title">Student Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="name" required placeholder="Enter your full name">
                        </div>
                        <div class="form-group">
                            <label>Matric Number</label>
                            <input type="text" name="matric" required placeholder="e.g., 2023/12345">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Level</label>
                            <select name="level" required>
                                <option value="">Select Level</option>
                                <option value="100">100 Level</option>
                                <option value="200">200 Level</option>
                                <option value="300">300 Level</option>
                                <option value="400">400 Level</option>
                                <option value="500">500 Level</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Programme</label>
                            <input type="text" name="programme" required placeholder="e.g., Biomedical Engineering">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Faculty</label>
                            <input type="text" name="faculty" required placeholder="e.g., Engineering">
                        </div>
                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" name="department" required placeholder="e.g.,Biomedical Engineering">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" name="date" required>
                    </div>
                </div>
                
                <div class="section">
                    <h2 class="section-title">Grading System</h2>
                    <div class="grade-info">
                        <div class="grade-item">A = 70-100 (5 points)</div>
                        <div class="grade-item">B = 60-69 (4 points)</div>
                        <div class="grade-item">C = 50-59 (3 points)</div>
                        <div class="grade-item">D = 45-49 (2 points)</div>
                        <div class="grade-item">E = 40-44 (1 point)</div>
                        <div class="grade-item">F = 0-39 (0 points)</div>
                    </div>
                </div>
                
                <div class="section">
                    <h2 class="section-title">Course Details</h2>
                    <div id="courses-container">
                        <div class="course-entry">
                            <div class="course-header">
                                <span class="course-title">Course 1</span>
                                <span class="course-number">1</span>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Course Name</label>
                                    <input type="text" name="course_name_1" required placeholder="e.g., Mathematics">
                                </div>
                                <div class="form-group">
                                    <label>Credit Unit</label>
                                    <input type="number" name="credit_unit_1" min="0" max="6" required placeholder="e.g., 3">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Score (0-100)</label>
                                <input type="number" name="score_1" min="0" max="100" required placeholder="Enter your score">
                            </div>
                        </div>
                        
                        <div class="course-entry">
                            <div class="course-header">
                                <span class="course-title">Course 2</span>
                                <span class="course-number">2</span>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Course Name</label>
                                    <input type="text" name="course_name_2" required placeholder="e.g., Physics">
                                </div>
                                <div class="form-group">
                                    <label>Credit Unit</label>
                                    <input type="number" name="credit_unit_2" min="0" max="6" required placeholder="e.g., 2">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Score (0-100)</label>
                                <input type="number" name="score_2" min="0" max="100" required placeholder="Enter your score">
                            </div>
                        </div>
                        
                        <div class="course-entry">
                            <div class="course-header">
                                <span class="course-title">Course 3</span>
                                <span class="course-number">3</span>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Course Name</label>
                                    <input type="text" name="course_name_3" required placeholder="e.g., Chemistry">
                                </div>
                                <div class="form-group">
                                    <label>Credit Unit</label>
                                    <input type="number" name="credit_unit_3" min="0" max="6" required placeholder="e.g., 3">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Score (0-100)</label>
                                <input type="number" name="score_3" min="0" max="100" required placeholder="Enter your score">
                            </div>
                        </div>
                    </div>
                    <input type="hidden" name="num_courses" id="num_courses" value="3">
                    <button type="button" class="btn btn-add-course" onclick="addCourse()">+ Add Another Course</button>
                </div>
                
                <button type="submit" class="btn btn-primary">Calculate CGPA</button>
            </form>
        </div>
    </div>
    
    <script>
        let courseCount = 3;
        function addCourse() {
            courseCount++;
            const container = document.getElementById('courses-container');
            const courseDiv = document.createElement('div');
            courseDiv.className = 'course-entry';
            courseDiv.innerHTML = `
                <div class="course-header">
                    <span class="course-title">Course ${courseCount}</span>
                    <span class="course-number">${courseCount}</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Course Name</label>
                        <input type="text" name="course_name_${courseCount}" required placeholder="e.g., Biology">
                    </div>
                    <div class="form-group">
                        <label>Credit Unit</label>
                        <input type="number" name="credit_unit_${courseCount}" min="0" max="6" required placeholder="e.g., 3">
                    </div>
                </div>
                <div class="form-group">
                    <label>Score (0-100)</label>
                    <input type="number" name="score_${courseCount}" min="0" max="100" required placeholder="Enter your score">
                </div>
            `;
            container.appendChild(courseDiv);
            document.getElementById('num_courses').value = courseCount;
        }
    </script>
</body>
</html>
